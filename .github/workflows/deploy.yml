name: Publicar Checkpoint

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Localizar o projeto
        id: project
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "directory=." >> "$GITHUB_OUTPUT"
          elif [ -f checkpoint/package.json ]; then
            echo "directory=checkpoint" >> "$GITHUB_OUTPUT"
          else
            echo "Não encontrei package.json na raiz nem em checkpoint."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Instalar dependências
        working-directory: ${{ steps.project.outputs.directory }}
        run: npm ci
      - name: Testar
        working-directory: ${{ steps.project.outputs.directory }}
        run: npm test
      - name: Gerar o site
        working-directory: ${{ steps.project.outputs.directory }}
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_USE_FIREBASE_EMULATORS: 'false'
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node --input-type=module -e 'const names = ["VITE_FIREBASE_API_KEY", "VITE_FIREBASE_AUTH_DOMAIN", "VITE_FIREBASE_PROJECT_ID", "VITE_FIREBASE_APP_ID"]; const missing = names.filter(name => !process.env[name]?.trim()); if (missing.length) { console.error("Cadastre os Repository secrets que faltam: " + missing.join(", ")); process.exit(1); }'
          npm run build -- --base "${PAGES_BASE_PATH%/}/"
      - name: Enviar o site compilado
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.project.outputs.directory }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
